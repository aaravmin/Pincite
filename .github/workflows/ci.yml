name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Unit tests are credential-free by design: no Supabase, BigQuery, LLM key or
      # browser. The end-to-end Playwright journeys need a real environment and stay out
      # of CI for now.
      - name: Unit tests
        run: pnpm test

      # Every Supabase/provider client is constructed inside a request, so the production
      # build needs no secrets.
      - name: Build
        run: pnpm build
